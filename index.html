<!DOCTYPE html>
<html>
	<head>
		<title>Launch Page</title>
      <link rel="stylesheet" href="launchPad.css">
      <script src="https://kit.fontawesome.com/3329260105.js" crossorigin="anonymous"></script>
    </head>
	<body>
    <form id="searchForm">
      <input type="text" placeholder="Search" id="searchBox">
    </form>
    <div class="coloumn">
      <div class="row">
        <a href="https://mail.google.com/mail/u/0/#inbox"><i class="icon fa-solid fa-envelope fa-5x"></i><span class="label">Gmail</span></a>
        <a href="https://keep.google.com/"><i class="icon fa-solid fa-note-sticky fa-5x"></i><span class="label">Notes</span></a>
        <a href="https://drive.google.com/drive"><i class="icon fa-brands fa-google-drive fa-5x"></i><span class="label">Drive</span></a>
        <a href="https://www.google.com/maps"><i class="icon fa-solid fa-map fa-5x"></i><span class="label">Maps</span></a>
        <a href="https://github.com/"><i class="icon fa-solid fa-code-pull-request fa-5x"></i><span class="label">Github</span></a>
      </div>
      <div class="row">
        <a href="https://www.facebook.com"><i class="icon fa-brands fa-facebook fa-5x"></i><span class="label">Facebook</span></a>
        <a href="https://www.instagram.com/"><i class="icon fa-brands fa-instagram fa-5x"></i><span class="label">Instagram</span></a>
        <a href="https://www.reddit.com/"><i class="icon fa-brands fa-reddit fa-5x"></i><span class="label">Reddit</span></a>
        <a href="https://www.pinterest.com/"><i class="icon fa-brands fa-pinterest fa-5x"></i><span class="label">Pinterest</span></a>
        <a href="https://outlook.live.com/mail/0/"><i class="icon fa-solid fa-inbox fa-5x"></i><span class="label">Outlook</span></a>
      </div>
      <div class="row">
        <a href="https://www.netflix.com/browse"><i class="icon fa-solid fa-film fa-5x"></i><span class="label">Netflix</span></a>
        <a href="https://www.disneyplus.com/en-gb/home"><i class="icon fa-brands fa-fort-awesome-alt fa-5x"></i><span class="label">Disney+</span></a>
        <a href="https://www.primevideo.com/"><i class="icon fa-brands fa-youtube fa-5x"></i><span class="label">Prime Video</span></a>
        <a href="https://www.youtube.com/"><i class="icon fa-brands fa-youtube fa-5x"></i><span class="label">YouTube</span></a>
        <a href="https://www.amazon.ca/"><i class="icon fa-brands fa-amazon fa-5x"></i><span class="label">Amazon</span></a>
      </div>
    </div>
	</body>
  <script type="text/javascript" src="./index.js"></script>
</html>
